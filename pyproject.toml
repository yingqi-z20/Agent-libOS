[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "agent-libos"
version = "1.0.1"
description = "A minimal Agent libOS runtime with process, object memory, capability, human approval, JIT tool, checkpoint, and audit primitives."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "Agent libOS contributors" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "openai>=2.43.0,<3",
    "psutil>=7.0.0,<8",
    "pydantic>=2.13.4,<3",
    "jsonschema>=4.25.0,<5",
    "pyyaml>=6.0.3,<7",
    "regex>=2024.11.6,<2027",
]

[project.urls]
Homepage = "https://github.com/yingqi-z20/Agent-libOS"
Documentation = "https://github.com/yingqi-z20/Agent-libOS/blob/main/README.md#documentation"
Repository = "https://github.com/yingqi-z20/Agent-libOS"
Issues = "https://github.com/yingqi-z20/Agent-libOS/issues"
"Release status" = "https://github.com/yingqi-z20/Agent-libOS/blob/main/docs/release_status.md"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
mcp = [
    "mcp>=1.27,<2",
]
pty = [
    "pywinpty>=2.0.13,<3; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=6.2.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]
release = [
    "check-wheel-contents==0.6.3",
    "hatchling==1.31.0",
    "twine==6.2.0",
]

[project.scripts]
agent-libos = "agent_libos.api.cli:cli"
agent-libos-gui-server = "agent_libos.api.gui.server:main"
agent-libos-migrate-tool-groups = "agent_libos.storage.tool_skill_migration:cli"

[tool.hatch.build.targets.wheel]
packages = ["agent_libos"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
timeout = 120
filterwarnings = [
    "error::RuntimeWarning",
    "default::DeprecationWarning",
]
markers = [
    "unit: fast pure-Python and parser/model tests",
    "runtime: runtime lifecycle, scheduler, process, persistence, and memory tests",
    "security: capability, policy, approval, filesystem, shell, and JIT containment tests",
    "self_evolution: Skill, checkpoint, image, launcher, and agent self-evolution tests",
    "providers: provider substrate, CLI, GUI server, JSON-RPC, clock, and script smoke tests",
    "benchmark: deterministic runtime-safety benchmark harness tests",
    "invariant(id): runtime safety invariant covered by the test",
    "platform_darwin: requires native Darwin filesystem semantics",
    "platform_linux: requires native Linux filesystem semantics",
    "real_deno: runs by default when deno is installed; use --skip-real-deno to skip",
    "real_llm: requires --run-real-llm and OpenAI-compatible credentials",
    "postgres: requires --run-postgres and AGENT_LIBOS_POSTGRES_DSN",
    "mcp: requires --run-mcp and the mcp optional dependency",
]
