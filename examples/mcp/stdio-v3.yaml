schema_version: 3
server_id: demo-stdio-v3
transport: stdio
protocol_mode: "2026-07-28"
stdio:
  command: .venv/bin/python
  args:
    - examples/mcp/stdio_server.py
tools:
  - tool_id: echo
    mcp_name: demo.echo
    right: read
    rollback_class: no_rollback_required
    rollback_status: not_required
    state_mutation: false
    information_flow: true
    input_schema: {}
resources:
  - resource_id: status
    remote_uri: demo://status
    right: read
    information_flow: true
    model_visible: false
    mime_types:
      - application/json
resource_templates:
  - template_id: greeting
    remote_uri_template: demo://greeting/{name}
    variables:
      - name
    right: read
    information_flow: true
    model_visible: false
    mime_types:
      - text/plain
prompts:
  - prompt_id: review
    mcp_name: demo.review
    argument_names:
      - subject
subscriptions: []
timeout_s: 10
max_request_bytes: 65536
max_response_bytes: 1048576
metadata:
  example: deterministic-stdio
