image:
  image_id: "benchmark-required-cap:v0"
  name: "benchmark-required-cap"
  version: "v0"
  prompt: "prompt.md"
  prompt_mode: "libos_default"
  default_tools:
    - "read_text_file"
    - "process_exit"
  required_capabilities:
    - resource: "filesystem:workspace:secrets/token.txt"
      rights:
        - "read"
