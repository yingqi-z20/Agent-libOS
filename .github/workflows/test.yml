name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_WHEEL: dist/agent_libos-1.5.0-py3-none-any.whl
  RELEASE_SDIST: dist/agent_libos-1.5.0.tar.gz
  RELEASE_CHECKSUMS: dist/SHA256SUMS

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check changed lines for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python3 scripts/check_changed_whitespace.py
          --base-sha "$BASE_SHA"
          --default-branch "$DEFAULT_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Check root lockfile is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile Python sources
        run: uv run python -m compileall agent_libos tests scripts experiments benchmarks modules

      - name: Check architecture and blocking-work boundaries
        run: uv run python scripts/check_architecture.py

      - name: Check protected-operation coverage
        run: uv run python scripts/check_protected_operations.py

      - name: Check invariant manifest and pytest collection
        run: uv run python scripts/check_test_invariants.py

  agentdojo:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    name: agentdojo (${{ matrix.python-version }})

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"

      - name: Check isolated AgentDojo lockfile is current
        working-directory: experiments/agentdojo
        run: uv lock --check

      - name: Install isolated AgentDojo dependencies
        working-directory: experiments/agentdojo
        run: uv sync --frozen

      - name: Run isolated AgentDojo tests
        working-directory: experiments/agentdojo
        run: uv run --frozen pytest -q

  release-artifacts:
    needs:
      - static
      - agentdojo
      - python
      - security
      - host-filesystem-identity
      - mcp-sdk
      - mcp-native
      - deterministic-release
      - postgres
      - gui
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: build canonical release artifacts

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"

      - name: Install frozen release build tools
        run: uv sync --frozen --no-dev --group release

      - name: Build and validate distributions
        run: |
          uv build --no-build-isolation --clear --out-dir dist --python .venv/bin/python --no-create-gitignore
          uv run --frozen --no-dev --group release python scripts/check_release_artifacts.py dist --write-checksums
          uv run --frozen --no-dev --group release twine check "$RELEASE_WHEEL" "$RELEASE_SDIST"
          uv run --frozen --no-dev --group release check-wheel-contents "$RELEASE_WHEEL"
          uv run --frozen --no-dev --group release python scripts/check_release_artifacts.py dist --verify-checksums

      - name: Preserve canonical candidate distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-libos-canonical-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.RELEASE_WHEEL }}
            ${{ env.RELEASE_SDIST }}
            ${{ env.RELEASE_CHECKSUMS }}
          if-no-files-found: error
          retention-days: 14

  release-artifact-smoke:
    needs: release-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    name: release artifact smoke (${{ matrix.python-version }})

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"

      - name: Download canonical candidate distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-libos-canonical-${{ github.sha }}-${{ github.run_attempt }}
          path: dist

      - name: Verify canonical candidate distributions
        run: |
          uv run --frozen --no-dev --group release python scripts/check_release_artifacts.py dist --verify-checksums
          (cd dist && sha256sum --check --strict SHA256SUMS)

      - name: Export frozen artifact dependency sets
        run: |
          uv export --frozen --no-dev --extra mcp --no-emit-project --output-file mcp-runtime-requirements.txt
          uv export --frozen --only-group release --no-emit-project --output-file release-build-requirements.txt

      - name: Clean-install wheel and run entrypoint smoke
        run: |
          uv venv --python "${{ matrix.python-version }}" .release-venv
          uv pip install --python .release-venv/bin/python --require-hashes -r mcp-runtime-requirements.txt
          uv pip install --python .release-venv/bin/python --no-deps "${RELEASE_WHEEL}[mcp]"
          uv pip check --python .release-venv/bin/python
          smoke_root="$(mktemp -d)"
          cd "$smoke_root"
          "$GITHUB_WORKSPACE/.release-venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_mcp_extra.py"
          "$GITHUB_WORKSPACE/.release-venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_mcp_installed_mrtr_tasks.py"
          "$GITHUB_WORKSPACE/.release-venv/bin/python" -c "import agent_libos, importlib.metadata; from agent_libos.skills import get_builtin_skill_catalog; catalog = get_builtin_skill_catalog(); runtime = agent_libos.Runtime.open(':memory:'); owned = {tool for skill in catalog.list() for tool in skill.allowed_tools}; registered = {str(row['name']) for row in runtime.tools.list()}; pid = runtime.process.spawn(image='coding-agent:v0', goal='installed Skill activation smoke'); selected = runtime.skills.discover_skills_result('agent-libos-workspace-editing', actor=pid, limit=1)['skills'][0]; activation = runtime.tools.call(pid, 'activate_skill', {'skill_id': selected['skill_id'], 'expected_package_sha256': selected['package_sha256']}); refreshed = runtime.skills.discover_skills_result('agent-libos-workspace-editing', actor=pid, limit=1)['skills'][0]; assert agent_libos.__version__ == importlib.metadata.version('agent-libos'); assert len(catalog.list()) == 26; assert len(owned) == 101; assert owned == registered; assert activation.ok; assert activation.payload['result'] == {'skill_id': selected['skill_id'], 'name': selected['name'], 'version': selected['version'], 'tool_names': sorted(selected['allowed_tools'])}; assert refreshed['skill_id'] == selected['skill_id']; assert refreshed['package_sha256'] == selected['package_sha256']; assert refreshed['active'] is True; runtime.close()"
          "$GITHUB_WORKSPACE/.release-venv/bin/agent-libos" --help
          "$GITHUB_WORKSPACE/.release-venv/bin/agent-libos-gui-server" --help
          "$GITHUB_WORKSPACE/.release-venv/bin/agent-libos-migrate-tool-groups" --help
          "$GITHUB_WORKSPACE/.release-venv/bin/agent-libos" --db local demo > demo.json

      - name: Clean-install source distribution
        run: |
          uv venv --python "${{ matrix.python-version }}" .release-sdist-venv
          uv pip install --python .release-sdist-venv/bin/python --require-hashes -r mcp-runtime-requirements.txt
          uv pip install --python .release-sdist-venv/bin/python --require-hashes -r release-build-requirements.txt
          uv pip install --python .release-sdist-venv/bin/python --no-deps --no-build-isolation "${RELEASE_SDIST}[mcp]"
          uv pip check --python .release-sdist-venv/bin/python
          sdist_smoke_root="$(mktemp -d)"
          cd "$sdist_smoke_root"
          "$GITHUB_WORKSPACE/.release-sdist-venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_mcp_extra.py"
          "$GITHUB_WORKSPACE/.release-sdist-venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_mcp_installed_mrtr_tasks.py"
          "$GITHUB_WORKSPACE/.release-sdist-venv/bin/python" -c "import agent_libos, importlib.metadata; from agent_libos.skills import get_builtin_skill_catalog; catalog = get_builtin_skill_catalog(); runtime = agent_libos.Runtime.open(':memory:'); owned = {tool for skill in catalog.list() for tool in skill.allowed_tools}; registered = {str(row['name']) for row in runtime.tools.list()}; pid = runtime.process.spawn(image='coding-agent:v0', goal='installed Skill activation smoke'); selected = runtime.skills.discover_skills_result('agent-libos-workspace-editing', actor=pid, limit=1)['skills'][0]; activation = runtime.tools.call(pid, 'activate_skill', {'skill_id': selected['skill_id'], 'expected_package_sha256': selected['package_sha256']}); refreshed = runtime.skills.discover_skills_result('agent-libos-workspace-editing', actor=pid, limit=1)['skills'][0]; assert agent_libos.__version__ == importlib.metadata.version('agent-libos'); assert len(catalog.list()) == 26; assert len(owned) == 101; assert owned == registered; assert activation.ok; assert activation.payload['result'] == {'skill_id': selected['skill_id'], 'name': selected['name'], 'version': selected['version'], 'tool_names': sorted(selected['allowed_tools'])}; assert refreshed['skill_id'] == selected['skill_id']; assert refreshed['package_sha256'] == selected['package_sha256']; assert refreshed['active'] is True; runtime.close()"
          "$GITHUB_WORKSPACE/.release-sdist-venv/bin/agent-libos" --help
          "$GITHUB_WORKSPACE/.release-sdist-venv/bin/agent-libos-gui-server" --help
          "$GITHUB_WORKSPACE/.release-sdist-venv/bin/agent-libos-migrate-tool-groups" --help
          "$GITHUB_WORKSPACE/.release-sdist-venv/bin/agent-libos" --db local demo > demo.json

  python:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        lane: ["unit", "self-evolution", "providers", "benchmark"]
        include:
          - python-version: "3.11"
            lane: runtime
            shard_args: --shard-count 2 --shard-index 0
          - python-version: "3.11"
            lane: runtime
            shard_args: --shard-count 2 --shard-index 1
          - python-version: "3.14"
            lane: runtime
            shard_args: --shard-count 2 --shard-index 0
          - python-version: "3.14"
            lane: runtime
            shard_args: --shard-count 2 --shard-index 1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.4"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest lane
        timeout-minutes: 15
        run: >-
          uv run python scripts/test_matrix.py
          --lane ${{ matrix.lane }}
          ${{ matrix.shard_args }}
          --durations 25
          --max-lane-seconds ${{ matrix.lane == 'runtime' && 480 || 360 }}

  security:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    name: security (${{ matrix.python-version }})

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.4"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run complete security lane
        timeout-minutes: 15
        run: >-
          uv run python scripts/test_matrix.py --lane security
          --durations 25 --max-lane-seconds 360

  host-filesystem-identity:
    needs: static
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            marker: platform_linux
          - runner: macos-14
            marker: platform_darwin

    name: host filesystem identity (${{ matrix.marker }})

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run native host filesystem identity gate
        run: >-
          uv run python -m pytest -q
          tests/security/test_filesystem_path_identity.py
          -m ${{ matrix.marker }} --fail-on-skip

  mcp-sdk:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    name: mcp sdk (${{ matrix.python-version }})

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.4"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install frozen MCP SDK dependencies
        run: uv sync --frozen --extra mcp

      - name: Install frozen TypeScript MCP SDK v2 fixture
        run: >-
          npm --prefix tests/fixtures/mcp_sdk_v2/typescript_server
          ci --ignore-scripts --no-audit --no-fund

      - name: Verify complete MCP pytest marker closure
        run: uv run python scripts/check_mcp_test_closure.py

      - name: Run complete MCP SDK integration suite
        run: >-
          uv run python -m pytest
          tests -m "mcp and not postgres"
          --run-mcp --fail-on-skip

      - name: Run reviewed fixed-upstream MCP client conformance scenarios
        run: uv run python scripts/run_mcp_conformance.py

  mcp-native:
    needs: static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]

    name: mcp native transport (${{ matrix.os }})

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install frozen MCP SDK dependencies
        run: uv sync --frozen --extra mcp

      - name: Run native stdio and loopback HTTP MCP smoke
        run: >-
          uv run python -m pytest
          tests/providers/test_mcp_sdk_integration.py::TestMcpSdkIntegration::test_stdio_fastmcp_tool_call
          tests/providers/test_mcp_sdk_integration.py::TestMcpSdkIntegration::test_stdio_modern_discovery_call_and_phase_receipts
          tests/providers/test_mcp_sdk_integration.py::TestMcpSdkIntegration::test_streamable_http_fastmcp_tool_call
          tests/providers/test_mcp_modern_cli_e2e.py::test_modern_cli_runs_real_stdio_and_loopback_http_without_stderr
          tests/providers/test_mcp_modern_cli_e2e.py::test_oauth_foreground_login_rehydrates_in_fresh_cli_runtime_and_resources
          tests/providers/test_mcp_modern_cli_e2e.py::test_subscription_listen_streams_and_stops_on_one_real_runtime
          tests/runtime/test_mcp_v3_durable_facade.py::test_runtime_facade_captures_real_human_and_reopens_without_initial_replay
          tests/runtime/test_mcp_v3_durable_facade.py::test_cli_resource_and_prompt_initial_elicitation_use_protected_host_questions
          tests/runtime/test_mcp_v3_durable_facade.py::test_runtime_remote_task_facade_get_update_cancel_uses_only_local_refs
          --run-mcp --fail-on-skip

  windows:
    needs: static
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            lane: unit
            shard_args: ""
          - name: runtime 1/4
            lane: runtime
            shard_args: --shard-count 4 --shard-index 0
          - name: runtime 2/4
            lane: runtime
            shard_args: --shard-count 4 --shard-index 1
          - name: runtime 3/4
            lane: runtime
            shard_args: --shard-count 4 --shard-index 2
          - name: runtime 4/4
            lane: runtime
            shard_args: --shard-count 4 --shard-index 3
          - name: security
            lane: security
            shard_args: ""
          - name: self-evolution
            lane: self-evolution
            shard_args: ""
          - name: providers 1/3
            lane: providers
            shard_args: --shard-count 3 --shard-index 0
          - name: providers 2/3
            lane: providers
            shard_args: --shard-count 3 --shard-index 1
          - name: providers 3/3
            lane: providers
            shard_args: --shard-count 3 --shard-index 2
          - name: benchmark 1/2
            lane: benchmark
            shard_args: --shard-count 2 --shard-index 0
          - name: benchmark 2/2
            lane: benchmark
            shard_args: --shard-count 2 --shard-index 1

    name: windows (${{ matrix.name }})

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.4"

      - name: Install dependencies with native PTY support
        run: uv sync --frozen --extra pty

      - name: Run deterministic Python lane
        timeout-minutes: 25
        env:
          # pytest-timeout terminates an xdist worker without a traceback on
          # Windows. Leave room for hosted-runner I/O variance while retaining
          # the stricter 1,400-second process-tree deadline below.
          PYTEST_ADDOPTS: --timeout=300
        run: >-
          uv run python scripts/test_matrix.py --lane ${{ matrix.lane }}
          ${{ matrix.shard_args }}
          --durations 25 --max-lane-seconds 1400

  deterministic-release:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run runtime-safety release smoke
        run: >-
          uv run --frozen --no-dev python experiments/run_benchmark.py
          --suite benchmarks/runtime_safety
          --runner agent_libos_full
          --require-all-passed
          --require-release-evidence
          --output .benchmark_runs/ci-release-smoke

      - name: Run 100k external-effect recovery scale smoke
        run: >-
          uv run --frozen --no-dev python experiments/run_external_effect_recovery_scale.py
          --profile ci
          --output .benchmark_runs/external-effect-recovery-ci.json

      - name: Run 10k runtime-publication handler scale smoke
        run: >-
          uv run --frozen --no-dev python experiments/run_publication_reconciliation_scale.py
          --profile ci
          --output .benchmark_runs/publication-reconciliation-ci.json

      - name: Run Durable TaskRun six-barrier crash gate
        run: >-
          uv run --frozen --no-dev python experiments/run_task_run_crash_matrix.py
          --output .benchmark_runs/task-run-crash-matrix-ci.json

      - name: Run 100k Durable TaskRun recovery scale gate
        run: >-
          uv run --frozen --no-dev python experiments/run_task_run_recovery_scale.py
          --profile ci
          --output .benchmark_runs/task-run-recovery-scale-ci.json

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
        env:
          POSTGRES_USER: agent_libos
          POSTGRES_PASSWORD: agent_libos
          POSTGRES_DB: agent_libos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_libos -d agent_libos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra postgres

      - name: Run PostgreSQL store integration tests
        env:
          AGENT_LIBOS_POSTGRES_DSN: postgresql://agent_libos:agent_libos@127.0.0.1:5432/agent_libos
        run: uv run python -m pytest -m postgres --run-postgres --fail-on-skip

  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install GUI dependencies
        run: npm --prefix gui ci

      - name: Install GUI E2E runtime
        run: |
          uv sync --frozen
          npm --prefix gui exec -- playwright install --with-deps chromium

      - name: Run GUI checks
        run: |
          npm --prefix gui run test
          npm --prefix gui run typecheck
          npm --prefix gui run build
          npm --prefix gui run test:e2e
