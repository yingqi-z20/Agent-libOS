name: external-effect-recovery-scale

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

concurrency:
  group: external-effect-recovery-scale
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  million-record-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run one-million-record recovery scale benchmark
        run: >-
          uv run python experiments/run_external_effect_recovery_scale.py
          --profile million
          --output .benchmark_runs/external-effect-recovery-million.json

      - name: Run 10k runtime-publication handler scale benchmark
        run: >-
          uv run python experiments/run_publication_reconciliation_scale.py
          --profile ci
          --output .benchmark_runs/publication-reconciliation-ci.json

      - name: Preserve structural metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-effect-recovery-million-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .benchmark_runs/external-effect-recovery-million.json
            .benchmark_runs/publication-reconciliation-ci.json
          if-no-files-found: error
          retention-days: 14
